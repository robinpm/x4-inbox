name: Rebuild OPDS

on:
  push:
    paths:
      - "Books/**"
      - "Papers/**"
      - "Articles/**"
      - "scripts/build_opds.py"
      - ".github/workflows/rebuild-opds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        run: python3 scripts/build_opds.py
      - name: Commit catalog if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opds.xml
          git diff --staged --quiet || git commit -m "Rebuild opds.xml"
          git push
